[package]
name = "p2panda-blobs"
version = "0.7.1"
edition = "2024"
authors = [
  "adz <x12@adz.garden>",
  "sandreae <contact@samandreae.com>",
  "glyph <glyph@mycelial.technology>",
]
description = "Large-file sync and storage"
repository = "https://github.com/p2panda/p2panda"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["storage", "streaming", "blobs", "bao", "blake3"]
rust-version = "1.96"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
iroh-base = { version = "1.0.0", default-features = false, features = ["key"] }
iroh-blobs = { git = "https://github.com/maackle/iroh-blobs", version = "0.103.0" }
n0-future = "0.3.2"
p2panda-core = { workspace = true, default-features = false }
p2panda-net = { workspace = true, default-features = false, features = ["iroh_endpoint", "gossip"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rand.workspace = true
serde.workspace = true
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
