[graph]
all-features = true

[advisories]
ignore = [
    # proc-macro-error2 is not maintained anymore, used by hax-lib-macros > .. > hpke-rs.
    {
      id = "RUSTSEC-2026-0173",
      reason = "Advisory is notice / INFO",
    },
    
    # chrono is not maintained anymore, used by wmi > network > iroh > iroh-gossip.
    {
      id = "RUSTSEC-2026-0543",
      reason = "Advisory is notice / INFO",
    },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
